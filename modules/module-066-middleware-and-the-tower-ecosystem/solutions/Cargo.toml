[package]
name = "module-066-solutions"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
http = "1.3.1"
tokio = { version = "1.53.1", features = ["time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
