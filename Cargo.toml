[workspace]
resolver = "2"
members = [
    "modules/*/exercises",
    "modules/*/solutions",
    "capstones/*/starter",
    "capstones/*/solution",
]

# Only solution crates are built/tested by default — exercises and starters are
# constructed to fail tests until the learner implements them (per spec §3).
# `cargo test` (without --workspace) tests only these default members.
default-members = [
    "modules/*/solutions",
    "capstones/*/solution",
]

# Worksheet-style modules (no crates), module-100 (README pointer only),
# and module-002 (intentional compile-error exercise per spec §3).
exclude = [
    "modules/module-000-orientation",
    "modules/module-002-variables-mutability-and-data-types/exercises",
    "modules/module-089-comparing-rust-career-specializations",
    "modules/module-096-open-source-contribution",
    "modules/module-097-building-your-portfolio",
    "modules/module-100-final-capstone-support",
]

[workspace.package]
edition = "2021"

[profile.release]
lto = true
